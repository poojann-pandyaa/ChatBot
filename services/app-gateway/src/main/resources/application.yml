server:
  port: 8080

# ── JWT Authentication ────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:ThisIsADefaultSecretKeyThatShouldBeChangedInProd1234}
  ttl-hours: 24

spring:
  application:
    name: app-gateway
  codec:
    max-in-memory-size: 1MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chatbot_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none   # Flyway owns the schema, validation disabled due to explicit routing exception
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chatbot_db}
    user: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    locations: classpath:db/migration
    baseline-on-migrate: true   # safe for existing DBs that predate Flyway
    baseline-version: 0
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  # ── Kafka (Phase 4) ───────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Phase 8 — idempotent producer to avoid duplicate events
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: app-gateway-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.llmops.gateway.kafka"

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always

# ── gRPC client config ────────────────────────────────────────────────────────
rag-engine:
  grpc:
    host: ${RAG_ENGINE_GRPC_HOST:rag-engine}
    port: ${RAG_ENGINE_GRPC_PORT:9091}

# Legacy REST url kept for health checks only (not used for chat after Phase 3)
services:
  rag-engine:
    url: ${RAG_ENGINE_URL:http://localhost:8000}

# ── Rate Limiting ─────────────────────────────────────────────────────────────
rate-limit:
  chat:
    requests-per-minute: ${RATE_LIMIT_CHAT_RPM:20}
    burst-capacity: ${RATE_LIMIT_CHAT_BURST:20}
  auth:
    requests-per-minute: ${RATE_LIMIT_AUTH_RPM:5}
    burst-capacity: ${RATE_LIMIT_AUTH_BURST:5}

resilience4j:
  circuitbreaker:
    instances:
      ragEngineClient:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
  retry:
    instances:
      ragEngineClient:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoff:
          enabled: true
          multiplier: 2
