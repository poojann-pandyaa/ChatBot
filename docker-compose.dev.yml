version: '3.8'

# ─── Local Development Secrets ────────────────────────────────────────────────
# Copy .env.example to .env and fill in real values before running.
# Never commit .env to git.

services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: redis-dev
    command: >
      /bin/sh -c
      "exec redis-server --requirepass \"$$REDIS_PASSWORD\"
      --loadmodule /opt/redis-stack/lib/redisearch.so"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-SuperSecureRedisPassword123}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-SuperSecureRedisPassword123}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecurePostgresPassword123}
      POSTGRES_DB: chatbot_db
    entrypoint: >
      /bin/bash -c "
      mkdir -p /docker-entrypoint-initdb.d &&
      echo \"echo 'host replication postgres all md5' >> /var/lib/postgresql/data/pg_hba.conf\" > /docker-entrypoint-initdb.d/01-setup-rep.sh &&
      exec docker-entrypoint.sh postgres -c wal_level=replica -c max_wal_senders=3
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Read Replica (dev simulation) ──────────────────────────────────────────
  # In production this would be a real Postgres streaming replica.
  # In dev we use a separate container on port 5433 so that the read-pool
  # and write-pool can be distinguished in pg_stat_activity and connection logs.
  postgres-replica:
    image: postgres:15-alpine
    container_name: postgres-replica-dev
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecurePostgresPassword123}
      POSTGRES_DB: chatbot_db
    entrypoint: >
      /bin/bash -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        rm -rf /var/lib/postgresql/data/*;
        echo 'Waiting for primary to be ready...';
        until pg_isready -h postgres -p 5432 -U postgres; do sleep 1; done;
        echo 'Taking base backup...';
        PGPASSWORD=\$${POSTGRES_PASSWORD:-SuperSecurePostgresPassword123} pg_basebackup -h postgres -D /var/lib/postgresql/data -U postgres -vP -R;
      fi;
      exec docker-entrypoint.sh postgres
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: qdrant-dev
    ports:
      - "6333:6333"
      - "6334:6334"

  elasticsearch:
    image: elasticsearch:8.12.1
    container_name: elasticsearch-dev
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ── Phase 4: Kafka (Redpanda — Kafka-API-compatible, no Zookeeper) ─────────
  redpanda:
    image: redpandadata/redpanda:v23.3.8
    container_name: redpanda-dev
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "9092:9092"
      - "8082:8082"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redpanda Console (Kafka UI)
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.4.5
    container_name: redpanda-console-dev
    ports:
      - "8088:8080"
    environment:
      - KAFKA_BROKERS=redpanda:29092
    depends_on:
      - redpanda

  ml-service:
    build:
      context: ./services/ml-service
      dockerfile: Dockerfile
    container_name: ml-service-dev
    ports:
      - "8001:8000"  # FastAPI REST
      - "50051:50051" # gRPC facade
    environment:
      - HF_HUB_OFFLINE=0
      - HF_DATASETS_OFFLINE=0
      - TRANSFORMERS_OFFLINE=0
      - GRPC_PORT=50051
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  rag-engine:
    build:
      context: .
      dockerfile: services/rag-engine/Dockerfile
    container_name: rag-engine-dev
    ports:
      - "8000:8000"   # HTTP (kept for health/metrics)
      - "9091:9091"   # gRPC server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=gemma2:2b
      - OLLAMA_NUM_PARALLEL=4
      - ML_SERVICE_URL=http://ml-service:8000
      - ML_SERVICE_GRPC_HOST=ml-service
      - ML_SERVICE_GRPC_PORT=50051
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-SuperSecureRedisPassword123}
      - GRPC_SERVER_PORT=9091
    depends_on:
      qdrant:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      ml-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 10s
      retries: 5

  app-gateway:
    build:
      context: .
      dockerfile: services/app-gateway/Dockerfile
    container_name: app-gateway-dev
    ports:
      - "8081:8080"
    environment:
      - RAG_ENGINE_URL=http://rag-engine:8000
      - RAG_ENGINE_GRPC_HOST=rag-engine
      - RAG_ENGINE_GRPC_PORT=9091
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-SuperSecureRedisPassword123}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/chatbot_db
      - REPLICA_DATASOURCE_URL=jdbc:postgresql://postgres-replica:5432/chatbot_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-SuperSecurePostgresPassword123}
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - JWT_SECRET=${JWT_SECRET:-SuperSecretJWTKey1234567890ABCDEFGH}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rag-engine:
        condition: service_healthy
      redpanda:
        condition: service_started
      postgres-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 15s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: frontend-dev
    ports:
      - "3000:3000"
    environment:
      - APP_GATEWAY_URL=http://app-gateway:8080
    depends_on:
      app-gateway:
        condition: service_healthy
